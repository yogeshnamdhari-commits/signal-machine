name: Auto Sync Dev to Main

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-sync-dev-to-main
  cancel-in-progress: true

jobs:
  validate-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r packages/ai-engine/requirements.txt

      - name: Compile-check Python source
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import py_compile
          root = pathlib.Path('packages/ai-engine')
          failures = []
          for path in root.rglob('*.py'):
              try:
                  py_compile.compile(str(path), doraise=True)
              except Exception as exc:
                  failures.append((str(path), str(exc)))
          if failures:
              for path, err in failures:
                  print(f'PY_COMPILE_FAILURE: {path}: {err}')
              raise SystemExit(1)
          print('Python compile check passed.')
          PY

      - name: Python tests
        working-directory: packages/ai-engine
        run: |
          mkdir -p ../../ci-artifacts
          python -m pytest -q --junitxml=../../ci-artifacts/python-tests.xml

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Backend dependency and build gate
        working-directory: packages/backend
        run: |
          npm install
          npm test -- --runInBand
          npm run build

      - name: Frontend dependency and build gate
        working-directory: packages/frontend
        run: |
          npm install
          npm run build

      - name: Backend dependency security audit
        id: backend-audit
        continue-on-error: true
        working-directory: packages/backend
        run: |
          mkdir -p ../../ci-artifacts/security
          npm audit --audit-level=high --json > ../../ci-artifacts/security/backend-npm-audit.json 2>&1
          rc=$?
          echo "$rc" > ../../ci-artifacts/security/backend-npm-audit.exit
          exit 0

      - name: Frontend dependency security audit
        id: frontend-audit
        continue-on-error: true
        working-directory: packages/frontend
        run: |
          mkdir -p ../../ci-artifacts/security
          npm audit --audit-level=high --json > ../../ci-artifacts/security/frontend-npm-audit.json 2>&1
          rc=$?
          echo "$rc" > ../../ci-artifacts/security/frontend-npm-audit.exit
          exit 0

      - name: Security dependency gate
        run: |
          backend_rc=$(cat ci-artifacts/security/backend-npm-audit.exit)
          frontend_rc=$(cat ci-artifacts/security/frontend-npm-audit.exit)
          echo "Backend npm audit exit: $backend_rc"
          echo "Frontend npm audit exit: $frontend_rc"
          if [ "$backend_rc" -ne 0 ] || [ "$frontend_rc" -ne 0 ]; then
            echo "SECURITY_GATE_FAILED: high/critical dependency vulnerability detected."
            echo "Audit JSON files are preserved as CI artifacts."
            exit 1
          fi
          echo "Security dependency gate passed: no high/critical npm audit findings."

      - name: Production repository validation gate
        run: |
          PYTHONPATH=packages/ai-engine python -m production_validation_gate

      - name: Capture CI verification context
        if: always()
        shell: bash
        run: |
          mkdir -p ci-artifacts
          {
            echo "workflow=${{ github.workflow }}"
            echo "run_id=${{ github.run_id }}"
            echo "run_attempt=${{ github.run_attempt }}"
            echo "event=${{ github.event_name }}"
            echo "branch=${{ github.ref_name }}"
            echo "commit=${{ github.sha }}"
            echo "repository=${{ github.repository }}"
            echo "runner_os=${{ runner.os }}"
            echo "python=$(python --version 2>&1 || true)"
            echo "node=$(node --version 2>&1 || true)"
            echo "npm=$(npm --version 2>&1 || true)"
            echo "captured_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > ci-artifacts/ci-verification-context.txt

      - name: Upload CI verification artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Sync dev to main
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main dev
          git checkout main
          git reset --hard origin/main
          git merge --ff-only origin/dev
          git push origin main

      - name: Sync summary
        if: success()
        run: |
          echo "Dev branch validated and fast-forwarded to main."
          echo "Commit: $(git rev-parse HEAD)"
