name: Auto Sync Dev to Main

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-sync-dev-to-main
  cancel-in-progress: true

jobs:
  validate-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r packages/ai-engine/requirements.txt

      - name: Compile-check Python source
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import py_compile
          root = pathlib.Path('packages/ai-engine')
          failures = []
          for path in root.rglob('*.py'):
              try:
                  py_compile.compile(str(path), doraise=True)
              except Exception as exc:
                  failures.append((str(path), str(exc)))
          if failures:
              for path, err in failures:
                  print(f'PY_COMPILE_FAILURE: {path}: {err}')
              raise SystemExit(1)
          print('Python compile check passed.')
          PY

      - name: Python tests
        working-directory: packages/ai-engine
        run: python -m pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backend dependency and build gate
        working-directory: packages/backend
        run: |
          npm install
          npm test -- --runInBand
          npm run build

      - name: Frontend dependency and build gate
        working-directory: packages/frontend
        run: |
          npm install
          npm run build

      - name: Configuration and repository contract gate
        run: |
          PYTHONPATH=packages/ai-engine python -m validation_gate

      - name: Sync dev to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main dev
          git checkout main
          git reset --hard origin/main
          git merge --ff-only origin/dev
          git push origin main

      - name: Sync summary
        run: |
          echo "Dev branch validated and fast-forwarded to main."
          echo "Commit: $(git rev-parse HEAD)"
