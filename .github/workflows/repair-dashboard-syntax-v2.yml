name: Repair Dashboard Syntax V2

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply source repairs
        run: python .github/scripts/repair_dashboard_syntax.py

      - name: Compile all Python files
        run: |
          python - <<'PY'
          import pathlib
          import py_compile
          root = pathlib.Path('packages/ai-engine')
          failures = []
          count = 0
          for path in root.rglob('*.py'):
              count += 1
              try:
                  py_compile.compile(str(path), doraise=True)
              except Exception as exc:
                  failures.append((str(path), str(exc)))
          print(f'Compiled {count} Python files.')
          if failures:
              for path, err in failures:
                  print(f'PY_COMPILE_FAILURE: {path}: {err}')
              raise SystemExit(1)
          print('Python compile check passed.')
          PY

      - name: Commit repairs when source changed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/ai-engine/dashboard/pages/1_Live_Sheet.py packages/ai-engine/dashboard/pages/2_Smart_Money.py .github/scripts/repair_dashboard_syntax.py
          if git diff --cached --quiet; then
            echo 'No source changes were required.'
            exit 0
          fi
          git commit -m 'Fix remaining dashboard f-string syntax errors'
          git push origin HEAD:dev
