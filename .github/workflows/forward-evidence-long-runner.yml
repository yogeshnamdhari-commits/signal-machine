          cp "$GITHUB_WORKSPACE/state-in/session_C.json" data/reports/forward_sessions/session_C.json
          python3 scanner/parameter_freeze.py
      - name: Run forward segment
        shell: bash
        env:
          BINANCE_TESTNET: "false"
        run: |
          set -euo pipefail
          cd packages/ai-engine
          python3 run_forward_session.py --session D --hours 5.8666666667 --finalize
      - name: Verify immutable final evidence
        shell: bash
        run: |
          set -euo pipefail
          cd packages/ai-engine
          python3 - <<'PY'
          import json
          from pathlib import Path
          from validation.forward_evidence_binding import verify_forward_evidence_report
          root = Path('data/reports/forward_sessions')
          for session in ('C','D'):
              artifact = json.loads((root / f'session_{session}.json').read_text())
              assert artifact['status'] == 'COMPLETED', artifact
              assert artifact['code_commit_sha'] == '${{github.sha}}', artifact
              assert artifact['real_orders'] is False, artifact
              assert artifact['orders_policy'] == 'NO_REAL_ORDERS', artifact
          report = verify_forward_evidence_report(root / 'forward_aggregate.json', expected_commit='${{github.sha}}')
          print('Immutable C/D aggregate verified.')
          print(json.dumps({
              'total_signals': report['total_signals'],
              'total_closed_trades': report['total_closed_trades'],
              'profit_factor': report['profit_factor'],
              'expectancy': report['expectancy'],
              'net_pnl': report['net_pnl'],
              'aggregate_sha256': report['aggregate_sha256'],
          }, indent=2))
          PY
      - name: Upload D state 58
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d-final-58-${{github.run_id}}
          path: |
            packages/ai-engine/data/parameter_freeze.json
            packages/ai-engine/data/reports/paper_trading_state.json
            packages/ai-engine/data/reports/paper_trading_trades.csv
            packages/ai-engine/data/reports/paper_trading_signals.csv
            packages/ai-engine/data/reports/forward_sessions/session_C.json
            packages/ai-engine/data/reports/forward_sessions/session_C_evidence/**
            packages/ai-engine/data/reports/forward_sessions/session_D.json
            packages/ai-engine/data/reports/forward_sessions/session_D_evidence/**
            packages/ai-engine/data/reports/forward_sessions/forward_aggregate.json
          if-no-files-found: warn
          retention-days: 90
