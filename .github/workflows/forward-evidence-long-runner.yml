name: Long-Run Forward Evidence

on:
  push:
    branches:
      - candidate-next-8d1b6b5
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signal-machine-forward-evidence
  cancel-in-progress: false

env:
  TARGET_SHA: ${{github.sha}}
  SESSION_MINUTES: "352"
  SEGMENTS_PER_SESSION: "58"
  REPO_ROOT: forward-runtime

# 58 x 352 minutes = 20,416 minutes = 340.27 hours = 14.18 days per session.
# 116 sequential jobs stay below the 256-job workflow limit; total runtime is ~28.36 days.
# Every segment uses a fresh GitHub-hosted runner and an immutable artifact handoff.
# Forward execution is simulation-only with production Binance public market data.

  c1:
    name: C — segment 1/58
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cd packages/ai-engine
          python3 -m pip install -r requirements.txt
      - name: Initialize clean C evidence state
        shell: bash
        run: |
          set -euo pipefail
          cd packages/ai-engine
          rm -f data/reports/paper_trading_state.json data/reports/paper_trading_trades.csv data/reports/paper_trading_signals.csv
          rm -f data/parameter_freeze.json
          rm -rf data/reports/forward_sessions
          mkdir -p data/reports/forward_sessions
      - name: Run forward segment
        shell: bash
        env:
          BINANCE_TESTNET: "false"
        run: |
          set -euo pipefail
          cd packages/ai-engine
          python3 run_forward_session.py --session C --hours 5.8666666667 --create-freeze
      - name: Upload C state 1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c-state-1-${{github.run_id}}
          path: |
            packages/ai-engine/data/parameter_freeze.json
            packages/ai-engine/data/reports/paper_trading_state.json
            packages/ai-engine/data/reports/paper_trading_trades.csv
            packages/ai-engine/data/reports/paper_trading_signals.csv
            packages/ai-engine/data/reports/forward_sessions/session_C.json
            packages/ai-engine/data/reports/forward_sessions/session_C_evidence/**
            packages/ai-engine/data/reports/forward_sessions/session_D.json
            packages/ai-engine/data/reports/forward_sessions/session_D_evidence/**
            packages/ai-engine/data/reports/forward_sessions/forward_aggregate.json
          if-no-files-found: warn
          retention-days: 90

  c2:
    name: C — segment 2/58
    needs: c1
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Download C segment 1 state
        uses: actions/download-artifact@v4
        with:
          name: c-state-1-${{github.run_id}}
          path: state-in
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
