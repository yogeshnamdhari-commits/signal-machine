
name: Long-Run Forward Evidence (Self-Hosted)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signal-machine-forward-evidence
  cancel-in-progress: false

env:
  TARGET_SHA: ${{ github.sha }}
  REPO_URL: https://github.com/yogeshnamdhari-commits/signal-machine.git

jobs:
  c1:
    name: C — segment 1/4 (100h)
    runs-on: [self-hosted, signal-machine-forward]
    timeout-minutes: 6030
    steps:
      - name: Run C segment 1
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/forward-runtime/C/repo"
          mkdir -p "$(dirname "$ROOT")"
          if [[ ! -d "$ROOT/.git" ]]; then git clone --no-tags "$REPO_URL" "$ROOT"; fi
          git -C "$ROOT" fetch --no-tags origin "$TARGET_SHA"
          git -C "$ROOT" checkout --detach "$TARGET_SHA"
          cd "$ROOT/packages/ai-engine"
          [[ "$(git -C "$ROOT" rev-parse HEAD)" == "$TARGET_SHA" ]]
          if [[ ! -f "data/reports/forward_sessions/session_C.json" ]]; then
            rm -f data/reports/paper_trading_state.json data/reports/paper_trading_trades.csv data/reports/paper_trading_signals.csv
          fi
          python3 -m pip install -r requirements.txt
          python3 run_forward_session.py --session C --hours 100 --create-freeze
      - name: Upload C segment 1 state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forward-c-state-1-${{ github.run_id }}
          path: |
            $GITHUB_WORKSPACE/forward-runtime/C/repo/packages/ai-engine/data/parameter_freeze.json
            $GITHUB_WORKSPACE/forward-runtime/C/repo/packages/ai-engine/data/reports/paper_trading_state.json
            $GITHUB_WORKSPACE/forward-runtime/C/repo/packages/ai-engine/data/reports/paper_trading_trades.csv
            $GITHUB_WORKSPACE/forward-runtime/C/repo/packages/ai-engine/data/reports/paper_trading_signals.csv
            $GITHUB_WORKSPACE/forward-runtime/C/repo/packages/ai-engine/data/reports/forward_sessions/session_C.json
          if-no-files-found: error
          retention-days: 90

  c2:
    name: C — segment 2/4 (100h)
    needs: c1
    runs-on: [self-hosted, signal-machine-forward]
    timeout-minutes: 6030
    steps:
      - name: Download C segment 1 state
        uses: actions/download-artifact@v4
        with:
          name: forward-c-state-1-${{ github.run_id }}
          path: state-in
      - name: Resume C segment 2
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/forward-runtime/C/repo"
          mkdir -p "$ROOT/packages/ai-engine/data/reports/forward_sessions"
          if [[ ! -d "$ROOT/.git" ]]; then git clone --no-tags "$REPO_URL" "$ROOT"; fi
          git -C "$ROOT" fetch --no-tags origin "$TARGET_SHA"
          git -C "$ROOT" checkout --detach "$TARGET_SHA"
          cd "$ROOT/packages/ai-engine"
          [[ "$(git -C "$ROOT" rev-parse HEAD)" == "$TARGET_SHA" ]]
          cp "$GITHUB_WORKSPACE/state-in/parameter_freeze.json" data/parameter_freeze.json
          cp "$GITHUB_WORKSPACE/state-in/paper_trading_state.json" data/reports/paper_trading_state.json
          cp "$GITHUB_WORKSPACE/state-in/paper_trading_trades.csv" data/reports/paper_trading_trades.csv
          cp "$GITHUB_WORKSPACE/state-in/paper_trading_signals.csv" data/reports/paper_trading_signals.csv
          cp "$GITHUB_WORKSPACE/state-in/session_C.json" data/reports/forward_sessions/session_C.json
          python3 scanner/parameter_freeze.py
          python3 run_forward_session.py --session C --hours 100
      - name: Upload C segment 2 state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forward-c-state-2-${{ github.run_id }}
          path: |
            $GITHUB_WORKSPACE/forward-runtime/C/repo/packages/ai-engine/data/parameter_freeze.json
            $GITHUB_WORKSPACE/forward-runtime/C/repo/packages/ai-engine/data/reports/paper_trading_state.json
            $GITHUB_WORKSPACE/forward-runtime/C/repo/packages/ai-engine/data/reports/paper_trading_trades.csv
            $GITHUB_WORKSPACE/forward-runtime/C/repo/packages/ai-engine/data/reports/paper_trading_signals.csv
            $GITHUB_WORKSPACE/forward-runtime/C/repo/packages/ai-engine/data/reports/forward_sessions/session_C.json
          if-no-files-found: error
          retention-days: 90

  c3:
    name: C — segment 3/4 (100h)
    needs: c2
    runs-on: [self-hosted, signal-machine-forward]
    timeout-minutes: 6030
    steps:
      - name: Download C segment 2 state
        uses: actions/download-artifact@v4
        with:
          name: forward-c-state-2-${{ github.run_id }}
          path: state-in
      - name: Resume C segment 3
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/forward-runtime/C/repo"
          mkdir -p "$ROOT/packages/ai-engine/data/reports/forward_sessions"
          if [[ ! -d "$ROOT/.git" ]]; then git clone --no-tags "$REPO_URL" "$ROOT"; fi
          git -C "$ROOT" fetch --no-tags origin "$TARGET_SHA"
          git -C "$ROOT" checkout --detach "$TARGET_SHA"
          cd "$ROOT/packages/ai-engine"
          [[ "$(git -C "$ROOT" rev-parse HEAD)" == "$TARGET_SHA" ]]
          cp "$GITHUB_WORKSPACE/state-in/parameter_freeze.json" data/parameter_freeze.json
          cp "$GITHUB_WORKSPACE/state-in/paper_trading_state.json" data/reports/paper_trading_state.json
          cp "$GITHUB_WORKSPACE/state-in/paper_trading_trades.csv" data/reports/paper_trading_trades.csv
          cp "$GITHUB_WORKSPACE/state-in/paper_trading_signals.csv" data/reports/paper_trading_signals.csv
          cp "$GITHUB_WORKSPACE/state-in/session_C.json" data/reports/forward_sessions/session_C.json
          python3 scanner/parameter_freeze.py
          python3 run_forward_session.py --session C --hours 100
      - name: Upload C segment 3 state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forward-c-state-3-${{ github.run_id }}
          path: |
            $GITHUB_WORKSPACE/forward-runtime/C/repo/packages/ai-engine/data/parameter_freeze.json
            $GITHUB_WORKSPACE/forward-runtime/C/repo/packages/ai-engine/data/reports/paper_trading_state.json
            $GITHUB_WORKSPACE/forward-runtime/C/repo/packages/ai-engine/data/reports/paper_trading_trades.csv
            $GITHUB_WORKSPACE/forward-runtime/C/repo/packages/ai-engine/data/reports/paper_trading_signals.csv
            $GITHUB_WORKSPACE/forward-runtime/C/repo/packages/ai-engine/data/reports/forward_sessions/session_C.json
          if-no-files-found: error
          retention-days: 90

  c4:
    name: C — final segment (36h)
    needs: c3
    runs-on: [self-hosted, signal-machine-forward]
    timeout-minutes: 2190
    steps:
      - name: Download C segment 3 state
        uses: actions/download-artifact@v4
        with:
          name: forward-c-state-3-${{ github.run_id }}
          path: state-in
      - name: Finalize C
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/forward-runtime/C/repo"
          mkdir -p "$ROOT/packages/ai-engine/data/reports/forward_sessions"
          if [[ ! -d "$ROOT/.git" ]]; then git clone --no-tags "$REPO_URL" "$ROOT"; fi
          git -C "$ROOT" fetch --no-tags origin "$TARGET_SHA"
          git -C "$ROOT" checkout --detach "$TARGET_SHA"
          cd "$ROOT/packages/ai-engine"
          [[ "$(git -C "$ROOT" rev-parse HEAD)" == "$TARGET_SHA" ]]
          cp "$GITHUB_WORKSPACE/state-in/parameter_freeze.json" data/parameter_freeze.json
          cp "$GITHUB_WORKSPACE/state-in/paper_trading_state.json" data/reports/paper_trading_state.json
          cp "$GITHUB_WORKSPACE/state-in/paper_trading_trades.csv" data/reports/paper_trading_trades.csv
          cp "$GITHUB_WORKSPACE/state-in/paper_trading_signals.csv" data/reports/paper_trading_signals.csv
          cp "$GITHUB_WORKSPACE/state-in/session_C.json" data/reports/forward_sessions/session_C.json
          python3 scanner/parameter_freeze.py
          python3 run_forward_session.py --session C --hours 36 --finalize
          python3 - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path("data/reports/forward_sessions/session_C.json").read_text())
          assert a["status"] == "COMPLETED", a
          assert a["code_commit_sha"] == "${{ github.sha }}", a
          assert a["real_orders"] is False, a
          assert a["orders_policy"] == "NO_REAL_ORDERS", a
          print("Session C immutable completion verified.")
          PY
      - name: Upload C final state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forward-c-final-${{ github.run_id }}
          path: |
            $GITHUB_WORKSPACE/forward-runtime/C/repo/packages/ai-engine/data/parameter_freeze.json
            $GITHUB_WORKSPACE/forward-runtime/C/repo/packages/ai-engine/data/reports/paper_trading_state.json
            $GITHUB_WORKSPACE/forward-runtime/C/repo/packages/ai-engine/data/reports/paper_trading_trades.csv
            $GITHUB_WORKSPACE/forward-runtime/C/repo/packages/ai-engine/data/reports/paper_trading_signals.csv
            $GITHUB_WORKSPACE/forward-runtime/C/repo/packages/ai-engine/data/reports/forward_sessions/session_C.json
            $GITHUB_WORKSPACE/forward-runtime/C/repo/packages/ai-engine/data/reports/forward_sessions/session_C_evidence/**
          if-no-files-found: error
          retention-days: 90

  d1:
    name: D — segment 1/4 (100h)
    needs: c4
    runs-on: [self-hosted, signal-machine-forward]
    timeout-minutes: 6030
    steps:
      - name: Download completed C state
        uses: actions/download-artifact@v4
        with:
          name: forward-c-final-${{ github.run_id }}
          path: c-state
      - name: Run D segment 1
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/forward-runtime/D/repo"
          mkdir -p "$ROOT/packages/ai-engine/data/reports/forward_sessions"
          if [[ ! -d "$ROOT/.git" ]]; then git clone --no-tags "$REPO_URL" "$ROOT"; fi
          git -C "$ROOT" fetch --no-tags origin "$TARGET_SHA"
          git -C "$ROOT" checkout --detach "$TARGET_SHA"
          cd "$ROOT/packages/ai-engine"
          [[ "$(git -C "$ROOT" rev-parse HEAD)" == "$TARGET_SHA" ]]
          cp "$GITHUB_WORKSPACE/c-state/parameter_freeze.json" data/parameter_freeze.json
          cp "$GITHUB_WORKSPACE/c-state/paper_trading_state.json" data/reports/paper_trading_state.json
          cp "$GITHUB_WORKSPACE/c-state/paper_trading_trades.csv" data/reports/paper_trading_trades.csv
          cp "$GITHUB_WORKSPACE/c-state/paper_trading_signals.csv" data/reports/paper_trading_signals.csv
          cp "$GITHUB_WORKSPACE/c-state/session_C.json" data/reports/forward_sessions/session_C.json
          cp -a "$GITHUB_WORKSPACE/c-state/session_C_evidence" data/reports/forward_sessions/
          python3 scanner/parameter_freeze.py
          python3 run_forward_session.py --session D --hours 100
      - name: Upload D segment 1 state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forward-d-state-1-${{ github.run_id }}
          path: |
            $GITHUB_WORKSPACE/forward-runtime/D/repo/packages/ai-engine/data/parameter_freeze.json
            $GITHUB_WORKSPACE/forward-runtime/D/repo/packages/ai-engine/data/reports/paper_trading_state.json
            $GITHUB_WORKSPACE/forward-runtime/D/repo/packages/ai-engine/data/reports/paper_trading_trades.csv
            $GITHUB_WORKSPACE/forward-runtime/D/repo/packages/ai-engine/data/reports/paper_trading_signals.csv
            $GITHUB_WORKSPACE/forward-runtime/D/repo/packages/ai-engine/data/reports/forward_sessions/session_C.json
            $GITHUB_WORKSPACE/forward-runtime/D/repo/packages/ai-engine/data/reports/forward_sessions/session_C_evidence/**
            $GITHUB_WORKSPACE/forward-runtime/D/repo/packages/ai-engine/data/reports/forward_sessions/session_D.json
          if-no-files-found: error
          retention-days: 90

  d2:
    name: D — segment 2/4 (100h)
    needs: d1
    runs-on: [self-hosted, signal-machine-forward]
    timeout-minutes: 6030
    steps:
      - name: Download D segment 1 state
        uses: actions/download-artifact@v4
        with:
          name: forward-d-state-1-${{ github.run_id }}
          path: state-in
      - name: Resume D segment 2
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/forward-runtime/D/repo"
          mkdir -p "$ROOT/packages/ai-engine/data/reports/forward_sessions"
          if [[ ! -d "$ROOT/.git" ]]; then git clone --no-tags "$REPO_URL" "$ROOT"; fi
          git -C "$ROOT" fetch --no-tags origin "$TARGET_SHA"
          git -C "$ROOT" checkout --detach "$TARGET_SHA"
          cd "$ROOT/packages/ai-engine"
          [[ "$(git -C "$ROOT" rev-parse HEAD)" == "$TARGET_SHA" ]]
          cp "$GITHUB_WORKSPACE/state-in/parameter_freeze.json" data/parameter_freeze.json
          cp "$GITHUB_WORKSPACE/state-in/paper_trading_state.json" data/reports/paper_trading_state.json
          cp "$GITHUB_WORKSPACE/state-in/paper_trading_trades.csv" data/reports/paper_trading_trades.csv
          cp "$GITHUB_WORKSPACE/state-in/paper_trading_signals.csv" data/reports/paper_trading_signals.csv
          cp "$GITHUB_WORKSPACE/state-in/session_C.json" data/reports/forward_sessions/session_C.json
          cp -a "$GITHUB_WORKSPACE/state-in/session_C_evidence" data/reports/forward_sessions/
          cp "$GITHUB_WORKSPACE/state-in/session_D.json" data/reports/forward_sessions/session_D.json
          python3 scanner/parameter_freeze.py
          python3 run_forward_session.py --session D --hours 100
      - name: Upload D segment 2 state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forward-d-state-2-${{ github.run_id }}
          path: |
            $GITHUB_WORKSPACE/forward-runtime/D/repo/packages/ai-engine/data/parameter_freeze.json
            $GITHUB_WORKSPACE/forward-runtime/D/repo/packages/ai-engine/data/reports/paper_trading_state.json
            $GITHUB_WORKSPACE/forward-runtime/D/repo/packages/ai-engine/data/reports/paper_trading_trades.csv
            $GITHUB_WORKSPACE/forward-runtime/D/repo/packages/ai-engine/data/reports/paper_trading_signals.csv
            $GITHUB_WORKSPACE/forward-runtime/D/repo/packages/ai-engine/data/reports/forward_sessions/session_C.json
            $GITHUB_WORKSPACE/forward-runtime/D/repo/packages/ai-engine/data/reports/forward_sessions/session_C_evidence/**
            $GITHUB_WORKSPACE/forward-runtime/D/repo/packages/ai-engine/data/reports/forward_sessions/session_D.json
          if-no-files-found: error
          retention-days: 90

  d3:
    name: D — segment 3/4 (100h)
    needs: d2
    runs-on: [self-hosted, signal-machine-forward]
    timeout-minutes: 6030
    steps:
      - name: Download D segment 2 state
        uses: actions/download-artifact@v4
        with:
          name: forward-d-state-2-${{ github.run_id }}
          path: state-in
      - name: Resume D segment 3
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/forward-runtime/D/repo"
          mkdir -p "$ROOT/packages/ai-engine/data/reports/forward_sessions"
          if [[ ! -d "$ROOT/.git" ]]; then git clone --no-tags "$REPO_URL" "$ROOT"; fi
          git -C "$ROOT" fetch --no-tags origin "$TARGET_SHA"
          git -C "$ROOT" checkout --detach "$TARGET_SHA"
          cd "$ROOT/packages/ai-engine"
          [[ "$(git -C "$ROOT" rev-parse HEAD)" == "$TARGET_SHA" ]]
          cp "$GITHUB_WORKSPACE/state-in/parameter_freeze.json" data/parameter_freeze.json
          cp "$GITHUB_WORKSPACE/state-in/paper_trading_state.json" data/reports/paper_trading_state.json
          cp "$GITHUB_WORKSPACE/state-in/paper_trading_trades.csv" data/reports/paper_trading_trades.csv
          cp "$GITHUB_WORKSPACE/state-in/paper_trading_signals.csv" data/reports/paper_trading_signals.csv
          cp "$GITHUB_WORKSPACE/state-in/session_C.json" data/reports/forward_sessions/session_C.json
          cp -a "$GITHUB_WORKSPACE/state-in/session_C_evidence" data/reports/forward_sessions/
          cp "$GITHUB_WORKSPACE/state-in/session_D.json" data/reports/forward_sessions/session_D.json
          python3 scanner/parameter_freeze.py
          python3 run_forward_session.py --session D --hours 100
      - name: Upload D segment 3 state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forward-d-state-3-${{ github.run_id }}
          path: |
            $GITHUB_WORKSPACE/forward-runtime/D/repo/packages/ai-engine/data/parameter_freeze.json
            $GITHUB_WORKSPACE/forward-runtime/D/repo/packages/ai-engine/data/reports/paper_trading_state.json
            $GITHUB_WORKSPACE/forward-runtime/D/repo/packages/ai-engine/data/reports/paper_trading_trades.csv
            $GITHUB_WORKSPACE/forward-runtime/D/repo/packages/ai-engine/data/reports/forward_sessions/session_C.json
            $GITHUB_WORKSPACE/forward-runtime/D/repo/packages/ai-engine/data/reports/forward_sessions/session_C_evidence/**
            $GITHUB_WORKSPACE/forward-runtime/D/repo/packages/ai-engine/data/reports/forward_sessions/session_D.json
          if-no-files-found: error
          retention-days: 90

  d4:
    name: D — final segment (36h) + aggregate verification
    needs: d3
    runs-on: [self-hosted, signal-machine-forward]
    timeout-minutes: 2190
    steps:
      - name: Download D segment 3 state
        uses: actions/download-artifact@v4
        with:
          name: forward-d-state-3-${{ github.run_id }}
          path: state-in
      - name: Finalize D and verify aggregate
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/forward-runtime/D/repo"
          mkdir -p "$ROOT/packages/ai-engine/data/reports/forward_sessions"
          if [[ ! -d "$ROOT/.git" ]]; then git clone --no-tags "$REPO_URL" "$ROOT"; fi
          git -C "$ROOT" fetch --no-tags origin "$TARGET_SHA"
          git -C "$ROOT" checkout --detach "$TARGET_SHA"
          cd "$ROOT/packages/ai-engine"
          [[ "$(git -C "$ROOT" rev-parse HEAD)" == "$TARGET_SHA" ]]
          cp "$GITHUB_WORKSPACE/state-in/parameter_freeze.json" data/parameter_freeze.json
          cp "$GITHUB_WORKSPACE/state-in/paper_trading_state.json" data/reports/paper_trading_state.json
          cp "$GITHUB_WORKSPACE/state-in/paper_trading_trades.csv" data/reports/paper_trading_trades.csv
          cp "$GITHUB_WORKSPACE/state-in/paper_trading_signals.csv" data/reports/paper_trading_signals.csv
          cp "$GITHUB_WORKSPACE/state-in/session_C.json" data/reports/forward_sessions/session_C.json
          cp -a "$GITHUB_WORKSPACE/state-in/session_C_evidence" data/reports/forward_sessions/
          cp "$GITHUB_WORKSPACE/state-in/session_D.json" data/reports/forward_sessions/session_D.json
          python3 scanner/parameter_freeze.py
          python3 run_forward_session.py --session D --hours 36 --finalize
          python3 - <<'PY'
          import json
          from pathlib import Path
          from validation.forward_evidence_binding import verify_forward_evidence_report
          root = Path("data/reports/forward_sessions")
          for session in ("C", "D"):
              artifact = json.loads((root / f"session_{session}.json").read_text())
              assert artifact["status"] == "COMPLETED", artifact
              assert artifact["code_commit_sha"] == "${{ github.sha }}", artifact
              assert artifact["real_orders"] is False, artifact
              assert artifact["orders_policy"] == "NO_REAL_ORDERS", artifact
          report = verify_forward_evidence_report(root / "forward_aggregate.json", expected_commit="${{ github.sha }}")
          print("Immutable C/D aggregate verified.")
          print(json.dumps({
              "total_signals": report["total_signals"],
              "total_closed_trades": report["total_closed_trades"],
              "profit_factor": report["profit_factor"],
              "expectancy": report["expectancy"],
              "net_pnl": report["net_pnl"],
              "aggregate_sha256": report["aggregate_sha256"],
          }, indent=2))
          PY
      - name: Upload immutable forward evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forward-evidence-${{ github.sha }}
          path: forward-runtime/D/repo/packages/ai-engine/data/reports/forward_sessions
          if-no-files-found: error
          retention-days: 90
