name: Repair Dashboard Syntax

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Repair known Python 3.11 f-string defects
        run: |
          python - <<'PY'
          from pathlib import Path

          # Live Sheet: nested f-strings with escaped quotes are illegal inside
          # an outer f-string expression on Python 3.11. Precompute the HTML.
          path = Path('packages/ai-engine/dashboard/pages/1_Live_Sheet.py')
          text = path.read_text(encoding='utf-8')

          replacements = {
              r"{f' <span style=\"font-size:0.6rem;color:#666;\">{sl_source}</span>' if sl_source else ''}": '{sl_source_html}',
              r"{f' <span style=\"font-size:0.6rem;color:#666;\">{tp1_source}</span>' if tp1_source else ''}": '{tp1_source_html}',
              r"{f'<span style=\"font-size:0.68rem;color:#3b82f6;\">→{rr_2:.1f}x</span>' if rr_2 > 0 else ''}": '{rr2_html}',
              r"{f'<span style=\"font-size:0.68rem;color:#8b5cf6;\">→{rr_3:.1f}x</span>' if rr_3 > 0 else ''}": '{rr3_html}',
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          # Also handle forms without backslash escapes, for idempotence.
          replacements_plain = {
              "{f' <span style=\"font-size:0.6rem;color:#666;\">{sl_source}</span>' if sl_source else ''}": '{sl_source_html}',
              "{f' <span style=\"font-size:0.6rem;color:#666;\">{tp1_source}</span>' if tp1_source else ''}": '{tp1_source_html}',
              "{f'<span style=\"font-size:0.68rem;color:#3b82f6;\">→{rr_2:.1f}x</span>' if rr_2 > 0 else ''}": '{rr2_html}',
              "{f'<span style=\"font-size:0.68rem;color:#8b5cf6;\">→{rr_3:.1f}x</span>' if rr_3 > 0 else ''}": '{rr3_html}',
          }
          for old, new in replacements_plain.items():
              text = text.replace(old, new)

          marker = '        # Precompute optional TP2/TP3 HTML outside the outer card f-string.\n'
          if marker not in text:
              raise SystemExit(f'{path}: TP helper marker not found')
          helper = """        # Precompute all nested HTML snippets outside the outer card f-string.
        sl_source_html = f' <span style=\"font-size:0.6rem;color:#666;\">{sl_source}</span>' if sl_source else ''
        tp1_source_html = f' <span style=\"font-size:0.6rem;color:#666;\">{tp1_source}</span>' if tp1_source else ''
        rr2_html = f'<span style=\"font-size:0.68rem;color:#3b82f6;\">→{rr_2:.1f}x</span>' if rr_2 > 0 else ''
        rr3_html = f'<span style=\"font-size:0.68rem;color:#8b5cf6;\">→{rr_3:.1f}x</span>' if rr_3 > 0 else ''
"""
          if 'sl_source_html =' not in text:
              text = text.replace(marker, helper + marker, 1)
          path.write_text(text, encoding='utf-8')
          print(f'Repaired {path}')

          # Smart Money: same nested-f-string problem for rr_2/rr_3 badges.
          path = Path('packages/ai-engine/dashboard/pages/2_Smart_Money.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              r"{f'<span style=\"font-size:0.65rem;color:#3b82f6;\">→{rr_2:.1f}x</span>' if rr_2 > 0 else ''}",
              '{rr2_html}',
          )
          text = text.replace(
              r"{f'<span style=\"font-size:0.65rem;color:#8b5cf6;\">→{rr_3:.1f}x</span>' if rr_3 > 0 else ''}",
              '{rr3_html}',
          )
          marker = '    # Precompute optional TP2/TP3 HTML outside the outer card f-string.\n'
          if marker not in text:
              raise SystemExit(f'{path}: TP helper marker not found')
          helper = """    # Precompute all nested HTML snippets outside the outer card f-string.
    rr2_html = f'<span style=\"font-size:0.65rem;color:#3b82f6;\">→{rr_2:.1f}x</span>' if rr_2 > 0 else ''
    rr3_html = f'<span style=\"font-size:0.65rem;color:#8b5cf6;\">→{rr_3:.1f}x</span>' if rr_3 > 0 else ''
"""
          if '    rr2_html =' not in text:
              text = text.replace(marker, helper + marker, 1)
          path.write_text(text, encoding='utf-8')
          print(f'Repaired {path}')
          PY

      - name: Compile all Python source
        run: |
          python - <<'PY'
          import pathlib
          import py_compile

          root = pathlib.Path('packages/ai-engine')
          failures = []
          count = 0
          for path in root.rglob('*.py'):
              count += 1
              try:
                  py_compile.compile(str(path), doraise=True)
              except Exception as exc:
                  failures.append((str(path), str(exc)))

          print(f'Compiled {count} Python files.')
          if failures:
              for path, err in failures:
                  print(f'PY_COMPILE_FAILURE: {path}: {err}')
              raise SystemExit(1)
          print('Python compile check passed.')
          PY

      - name: Commit fixes and remove repair workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/ai-engine/dashboard/pages/1_Live_Sheet.py packages/ai-engine/dashboard/pages/2_Smart_Money.py
          git commit -m 'Fix remaining dashboard f-string syntax errors'
          git rm .github/workflows/repair-dashboard-syntax.yml
          git commit -m 'Remove one-time dashboard syntax repair workflow'
          git push origin HEAD:dev
