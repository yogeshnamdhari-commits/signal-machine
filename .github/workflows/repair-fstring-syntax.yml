name: One-Time Dashboard Syntax Repair

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/repair-fstring-syntax.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Repair only the confirmed dashboard f-string syntax defects
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          windows = {
              Path('packages/ai-engine/dashboard/pages/1_Live_Sheet.py'): (1250, 1295),
              Path('packages/ai-engine/dashboard/pages/2_Smart_Money.py'): (225, 265),
          }

          for path, (start, end) in windows.items():
              lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
              if len(lines) < start:
                  raise SystemExit(f'{path}: expected at least {start} lines, found {len(lines)}')

              changed = False
              for idx in range(start - 1, min(end, len(lines))):
                  new_line = lines[idx].replace(r'\"', '"')
                  if new_line != lines[idx]:
                      lines[idx] = new_line
                      changed = True

              if not changed:
                  raise SystemExit(f'{path}: no escaped quotes found in repair window {start}-{end}')

              path.write_text(''.join(lines), encoding='utf-8')
              print(f'Repaired escaped quotes near the confirmed syntax error in {path}')
          PY

      - name: Compile every Python source file
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import py_compile

          root = pathlib.Path('packages/ai-engine')
          failures = []
          count = 0
          for path in root.rglob('*.py'):
              count += 1
              try:
                  py_compile.compile(str(path), doraise=True)
              except Exception as exc:
                  failures.append((str(path), str(exc)))

          print(f'Compiled {count} Python files.')
          if failures:
              for path, err in failures:
                  print(f'PY_COMPILE_FAILURE: {path}: {err}')
              raise SystemExit(1)
          print('Python compile check passed.')
          PY

      - name: Verify patch cleanliness
        run: git diff --check

      - name: Commit repaired source and remove one-time repair workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/repair-fstring-syntax.yml
          git add packages/ai-engine/dashboard/pages/1_Live_Sheet.py packages/ai-engine/dashboard/pages/2_Smart_Money.py .github/workflows/repair-fstring-syntax.yml
          git commit -m 'Fix dashboard f-string syntax errors'

      - name: Push repaired dev branch
        run: git push origin HEAD:dev

      - name: Promote repaired dev commit to main
        run: git push origin HEAD:main
