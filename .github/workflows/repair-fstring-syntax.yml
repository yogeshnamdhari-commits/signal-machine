name: One-Time Dashboard Syntax Repair

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/repair-fstring-syntax.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Repair confirmed dashboard syntax errors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def repair_nested_tp(path: Path, start_marker: str, end_marker: str, helper_lines: list[str], replacement: str) -> None:
              text = path.read_text(encoding='utf-8')
              start = text.find(start_marker)
              end = text.find(end_marker, start)
              if start < 0 or end < 0 or end <= start:
                  raise SystemExit(f'{path}: nested TP2/TP3 block markers not found')

              # Find the opening quote of the surrounding outer f-string by
              # scanning backwards from the nested block, regardless of the
              # outer variable name or indentation.
              outer_double = text.rfind('f"""', 0, start)
              outer_single = text.rfind("f'''", 0, start)
              outer = max(outer_double, outer_single)
              if outer < 0:
                  raise SystemExit(f'{path}: surrounding outer f-string not found')
              insert_at = text.rfind('\n', 0, outer) + 1

              text = text[:start] + replacement + text[end:]
              helper = '\n'.join(helper_lines) + '\n\n'
              text = text[:insert_at] + helper + text[insert_at:]
              path.write_text(text, encoding='utf-8')
              print(f'Repaired {path}')

          helper_live = [
              '        # Precompute optional TP2/TP3 HTML outside the outer card f-string.',
              '        tp23_html = ""',
              '        if tp2 > 0:',
              '            tp23_parts = [f\'<span style="color:#3b82f6;">🎯 TP2 ${tp2:,.4f} ({rr_2:.1f}x)</span>\']',
              '            if tp3 > 0:',
              '                tp23_parts.append(f\'<span style="color:#8b5cf6;">🚀 TP3 ${tp3:,.4f} ({rr_3:.1f}x)</span>\')',
              '            tp23_html = \'<div style="display:flex; gap:8px; font-size:0.72rem; margin-top:1px; flex-wrap:wrap;">\' + \'\'.join(tp23_parts) + \'</div>\'',
          ]
          repair_nested_tp(
              Path('packages/ai-engine/dashboard/pages/1_Live_Sheet.py'),
              '            {f\'\'\'<div style="display:flex; gap:8px; font-size:0.72rem; margin-top:1px; flex-wrap:wrap;">',
              '            <div style="display:flex; gap:10px; font-size:0.75rem; color:#94a3b8; flex-wrap:wrap;">',
              helper_live,
              '            {tp23_html}\n',
          )

          helper_sm = [
              '    # Precompute optional TP2/TP3 HTML outside the outer card f-string.',
              '    tp23_html = ""',
              '    if tp2 > 0:',
              '        tp23_parts = [f\'<span style="color:#3b82f6;">🎯 TP2 ${tp2:,.4f} ({rr_2:.1f}x)</span>\']',
              '        if tp3 > 0:',
              '            tp23_parts.append(f\'<span style="color:#8b5cf6;">🚀 TP3 ${tp3:,.4f} ({rr_3:.1f}x)</span>\')',
              '        tp23_html = \'<div style="display:flex;gap:8px;font-size:0.68rem;margin-top:1px;flex-wrap:wrap;">\' + \'\'.join(tp23_parts) + \'</div>\'',
          ]
          repair_nested_tp(
              Path('packages/ai-engine/dashboard/pages/2_Smart_Money.py'),
              "        {f'''<div style=",
              '        <!-- SL/TP distance bars -->',
              helper_sm,
              '        {tp23_html}\n',
          )
          PY

      - name: Compile every Python source file
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import py_compile

          root = pathlib.Path('packages/ai-engine')
          failures = []
          count = 0
          for path in root.rglob('*.py'):
              count += 1
              try:
                  py_compile.compile(str(path), doraise=True)
              except Exception as exc:
                  failures.append((str(path), str(exc)))

          print(f'Compiled {count} Python files.')
          if failures:
              for path, err in failures:
                  print(f'PY_COMPILE_FAILURE: {path}: {err}')
              raise SystemExit(1)
          print('Python compile check passed.')
          PY

      - name: Verify diff
        run: git diff --check

      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/ai-engine/dashboard/pages/1_Live_Sheet.py packages/ai-engine/dashboard/pages/2_Smart_Money.py
          git commit -m 'Fix dashboard f-string syntax errors'

      - name: Push repaired dev
        run: git push origin HEAD:dev

      - name: Remove one-time repair workflow from dev
        shell: bash
        run: |
          git rm .github/workflows/repair-fstring-syntax.yml
          git commit -m 'Remove one-time dashboard repair workflow'
          git push origin HEAD:dev
