name: One-Time Dashboard Syntax Repair

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/repair-fstring-syntax.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Repair confirmed f-string syntax defects
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Live Sheet: remove escaped quotes in the exact region reported by CI.
          live_path = Path('packages/ai-engine/dashboard/pages/1_Live_Sheet.py')
          live_lines = live_path.read_text(encoding='utf-8').splitlines(keepends=True)
          live_start, live_end = 1250, 1295
          if len(live_lines) < live_start:
              raise SystemExit(f'{live_path}: expected at least {live_start} lines, found {len(live_lines)}')
          live_changed = False
          for idx in range(live_start - 1, min(live_end, len(live_lines))):
              new_line = live_lines[idx].replace(r'\"', '"')
              if new_line != live_lines[idx]:
                  live_lines[idx] = new_line
                  live_changed = True
          if not live_changed:
              raise SystemExit(f'{live_path}: no escaped quotes found in repair window {live_start}-{live_end}')
          live_path.write_text(''.join(live_lines), encoding='utf-8')
          print(f'Repaired {live_path}')

          # Smart Money: nested f-strings containing backslash escapes are illegal
          # in Python 3.11. Precompute the HTML fragment outside the outer f-string.
          sm_path = Path('packages/ai-engine/dashboard/pages/2_Smart_Money.py')
          sm_text = sm_path.read_text(encoding='utf-8')
          old = r"""        {f'''<div style=\"display:flex;gap:8px;font-size:0.68rem;margin-top:1px;flex-wrap:wrap;\">\n            {f\"<span style=\\\"color:#3b82f6;\\\">🎯 TP2 ${tp2:,.4f} ({rr_2:.1f}x)</span>\" if tp2 > 0 else \"\"}\n            {f\"<span style=\\\"color:#8b5cf6;\\\">🚀 TP3 ${tp3:,.4f} ({rr_3:.1f}x)</span>\" if tp3 > 0 else \"\"}\n        </div>''' if tp2 > 0 else ''}\n"""
          new = """        {tp23_html}\n"""
          if old not in sm_text:
              raise SystemExit(f'{sm_path}: exact nested f-string block not found')

          marker = "    # SL/TP distance bars\n"
          if marker not in sm_text:
              raise SystemExit(f'{sm_path}: insertion marker not found')

          helper = """    # Precompute optional TP2/TP3 HTML outside the outer card f-string.\n    tp23_html = \"\"\n    if tp2 > 0:\n        tp23_parts = [f'<span style=\"color:#3b82f6;\">🎯 TP2 ${tp2:,.4f} ({rr_2:.1f}x)</span>']\n        if tp3 > 0:\n            tp23_parts.append(f'<span style=\"color:#8b5cf6;\">🚀 TP3 ${tp3:,.4f} ({rr_3:.1f}x)</span>')\n        tp23_html = '<div style=\"display:flex;gap:8px;font-size:0.68rem;margin-top:1px;flex-wrap:wrap;\">' + ''.join(tp23_parts) + '</div>'\n\n"""
          sm_text = sm_text.replace(old, new, 1)
          sm_text = sm_text.replace(marker, helper + marker, 1)
          sm_path.write_text(sm_text, encoding='utf-8')
          print(f'Repaired {sm_path}')
          PY

      - name: Compile every Python source file
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import py_compile

          root = pathlib.Path('packages/ai-engine')
          failures = []
          count = 0
          for path in root.rglob('*.py'):
              count += 1
              try:
                  py_compile.compile(str(path), doraise=True)
              except Exception as exc:
                  failures.append((str(path), str(exc)))

          print(f'Compiled {count} Python files.')
          if failures:
              for path, err in failures:
                  print(f'PY_COMPILE_FAILURE: {path}: {err}')
              raise SystemExit(1)
          print('Python compile check passed.')
          PY

      - name: Verify patch cleanliness
        run: git diff --check

      - name: Commit repaired source and remove one-time repair workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/repair-fstring-syntax.yml
          git add packages/ai-engine/dashboard/pages/1_Live_Sheet.py packages/ai-engine/dashboard/pages/2_Smart_Money.py .github/workflows/repair-fstring-syntax.yml
          git commit -m 'Fix dashboard f-string syntax errors'

      - name: Push repaired dev branch
        run: git push origin HEAD:dev

      - name: Promote repaired dev commit to main
        run: git push origin HEAD:main
