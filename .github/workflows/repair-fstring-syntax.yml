name: One-Time Dashboard Syntax Repair

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/repair-fstring-syntax.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Repair confirmed dashboard syntax errors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Live Sheet: move the nested TP2/TP3 f-string out of the outer
          # card f-string. This preserves the rendered HTML without using
          # backslashes inside an f-string expression.
          path = Path('packages/ai-engine/dashboard/pages/1_Live_Sheet.py')
          text = path.read_text(encoding='utf-8')
          start_marker = '            {f\'\'\'<div style="display:flex; gap:8px; font-size:0.72rem; margin-top:1px; flex-wrap:wrap;">'
          end_marker = '            <div style="display:flex; gap:10px; font-size:0.75rem; color:#94a3b8; flex-wrap:wrap;">'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit(f'{path}: TP2/TP3 nested f-string markers not found')
          text = text[:start] + '            {tp23_html}\n' + text[end:]

          marker = '    card_html = f"""'
          if marker not in text:
              raise SystemExit(f'{path}: card_html marker not found')

          helper_lines = [
              '    # Precompute optional TP2/TP3 HTML outside the outer card f-string.',
              '    tp23_html = ""',
              '    if tp2 > 0:',
              '        tp23_parts = [f\'<span style="color:#3b82f6;">🎯 TP2 ${tp2:,.4f} ({rr_2:.1f}x)</span>\']',
              '        if tp3 > 0:',
              '            tp23_parts.append(f\'<span style="color:#8b5cf6;">🚀 TP3 ${tp3:,.4f} ({rr_3:.1f}x)</span>\')',
              '        tp23_html = \'<div style="display:flex; gap:8px; font-size:0.72rem; margin-top:1px; flex-wrap:wrap;">\' + \'\'.join(tp23_parts) + \'</div>\'',
              '',
          ]
          helper = '\n'.join(helper_lines)
          text = text.replace(marker, helper + '\n' + marker, 1)
          path.write_text(text, encoding='utf-8')
          print(f'Repaired {path}')

          # 2) Smart Money: move the TP2/TP3 HTML out of the outer f-string.
          path = Path('packages/ai-engine/dashboard/pages/2_Smart_Money.py')
          text = path.read_text(encoding='utf-8')
          start_marker = "        {f'''<div style="
          end_marker = '        <!-- SL/TP distance bars -->'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit(f'{path}: TP2/TP3 nested f-string markers not found')
          text = text[:start] + '        {tp23_html}\n' + text[end:]

          marker = '    card_html = f"""'
          if marker not in text:
              raise SystemExit(f'{path}: card_html marker not found')

          helper_lines = [
              '    # Precompute optional TP2/TP3 HTML outside the outer card f-string.',
              '    tp23_html = ""',
              '    if tp2 > 0:',
              '        tp23_parts = [f\'<span style="color:#3b82f6;">🎯 TP2 ${tp2:,.4f} ({rr_2:.1f}x)</span>\']',
              '        if tp3 > 0:',
              '            tp23_parts.append(f\'<span style="color:#8b5cf6;">🚀 TP3 ${tp3:,.4f} ({rr_3:.1f}x)</span>\')',
              '        tp23_html = \'<div style="display:flex;gap:8px;font-size:0.68rem;margin-top:1px;flex-wrap:wrap;">\' + \'\'.join(tp23_parts) + \'</div>\'',
              '',
          ]
          helper = '\n'.join(helper_lines)
          text = text.replace(marker, helper + '\n' + marker, 1)
          path.write_text(text, encoding='utf-8')
          print(f'Repaired {path}')
          PY

      - name: Compile every Python source file
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import py_compile

          root = pathlib.Path('packages/ai-engine')
          failures = []
          count = 0
          for path in root.rglob('*.py'):
              count += 1
              try:
                  py_compile.compile(str(path), doraise=True)
              except Exception as exc:
                  failures.append((str(path), str(exc)))

          print(f'Compiled {count} Python files.')
          if failures:
              for path, err in failures:
                  print(f'PY_COMPILE_FAILURE: {path}: {err}')
              raise SystemExit(1)
          print('Python compile check passed.')
          PY

      - name: Verify diff
        run: git diff --check

      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/ai-engine/dashboard/pages/1_Live_Sheet.py packages/ai-engine/dashboard/pages/2_Smart_Money.py
          git commit -m 'Fix dashboard f-string syntax errors'

      - name: Push repaired dev
        run: git push origin HEAD:dev

      - name: Remove one-time repair workflow from dev
        shell: bash
        run: |
          git rm .github/workflows/repair-fstring-syntax.yml
          git commit -m 'Remove one-time dashboard repair workflow'
          git push origin HEAD:dev
