name: Pull Request Validation

on:
  push:
    branches:
      - forward-preflight-hardening-20260922
  pull_request:
    branches:
      - main
      - candidate-next-8d1b6b5

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-engine-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install AI engine dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r packages/ai-engine/requirements.txt

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip-audit
          pip-audit -r packages/ai-engine/requirements.txt

      - name: Record source provenance
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "HEAD=$(git rev-parse HEAD)"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          git status --short

      - name: Compile-check AI engine
        run: |
          python - <<'PY'
          import pathlib
          import py_compile

          root = pathlib.Path("packages/ai-engine")
          failures = []
          for path in root.rglob("*.py"):
              try:
                  py_compile.compile(str(path), doraise=True)
              except Exception as exc:
                  failures.append((str(path), str(exc)))

          if failures:
              for path, error in failures:
                  print(f"PY_COMPILE_FAILURE: {path}: {error}")
              raise SystemExit(1)

          print("Python compile check passed.")
          PY

      - name: Focused live-gate regression
        working-directory: packages/ai-engine
        run: |
          python -m pytest -q tests/test_live_certification_binding.py

      - name: Full AI engine test suite
        working-directory: packages/ai-engine
        run: |
          python -m pytest -q

      - name: Execution layer validation
        working-directory: packages/ai-engine
        run: |
          python validate_execution.py

      - name: Upload execution validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-validation-${{ github.sha }}
          path: packages/ai-engine/data/reports/execution_validation_results.json
          if-no-files-found: warn
          retention-days: 14

      - name: Production validation gate
        run: |
          PYTHONPATH=packages/ai-engine python -m production_validation_gate
